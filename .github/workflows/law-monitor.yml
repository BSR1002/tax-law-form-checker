name: Daily law monitor
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily-law-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test monitor without network
        run: python -m unittest -v test_law_monitor test_dashboard_monitor
      - name: Monitor revision metadata
        id: monitor
        continue-on-error: true
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python dashboard_monitor.py
      - name: Report exhausted monitor retries
        if: steps.monitor.outputs.result == 'exhausted'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import requests

          try:
              session = requests.Session()
              session.headers.update({
                  "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                  "Accept": "application/vnd.github+json",
              })
              url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/issues"
              page = 1
              while True:
                  response = session.get(
                      url, params={"state": "open", "per_page": 100, "page": page},
                      timeout=30,
                  )
                  response.raise_for_status()
                  issues = response.json()
                  if not isinstance(issues, list):
                      raise ValueError("Invalid issues response")
                  if any(
                      "pull_request" not in issue
                      and issue.get("title", "").startswith("[모니터 오류]")
                      for issue in issues
                  ):
                      print("An open monitor error issue already exists; skipping duplicate.")
                      sys.exit(0)
                  if len(issues) < 100:
                      break
                  page += 1

              today = datetime.now(ZoneInfo("Asia/Seoul")).date()
              run_url = (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              )
              body = "\n".join([
                  "Daily law monitor가 3분 간격으로 총 3회 실행을 시도했으나 모두 실패했습니다.",
                  "",
                  "- 법령 변경 여부 확인 불가",
                  "- 기존 baseline 유지",
                  "- 재확인 필요",
                  f"- GitHub Actions 실행 링크: {run_url}",
              ])
              response = session.post(url, json={
                  "title": f"[모니터 오류] 법령 API 조회 3회 연속 실패 - {today}",
                  "body": body,
              }, timeout=30)
              response.raise_for_status()
              print("Created monitor error issue.")
          except Exception:
              # Do not expose response bodies, request URLs, tokens, or exceptions.
              print("Could not report monitor failure; check GitHub access and permissions.")
              sys.exit(1)
          PY
      - name: Persist dashboard data and successful baseline
        if: always() && (steps.monitor.outputs.result == 'success' || steps.monitor.outputs.result == 'exhausted')
        env:
          MONITOR_RESULT: ${{ steps.monitor.outputs.result }}
        run: |
          git add -- public/monitoring.json
          if [ "$MONITOR_RESULT" = "success" ]; then
            git add -- law_monitor_state.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update law dashboard data'
          git push
      - name: Preserve failed workflow status
        if: always() && steps.monitor.outcome == 'failure'
        run: exit 1
