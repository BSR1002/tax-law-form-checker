name: Daily law monitor
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: daily-law-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test monitor without network
        run: python -m unittest -v test_law_monitor
      - name: Monitor revision metadata
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python law_monitor.py
      - name: Persist baseline only when changed
        run: |
          git add -- law_monitor_state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update law monitor state'
          git push
